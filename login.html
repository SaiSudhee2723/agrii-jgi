<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access — Geosense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #0b1d3a;          /* signature headline navy */
      --ink-2: #1d2f4f;        /* secondary navy */
      --accent: #5b7cf0;       /* Geosense signature periwinkle blue */
      --dot: #2fe0d0;          /* glowing cyan / turquoise */
      --panel: #0e1f3d;        /* dark split panel */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border-color: rgba(11, 29, 58, 0.12);
      --border-focus: #5b7cf0;
      --text-main: #0b1d3a;
      --text-muted: rgba(11, 29, 58, 0.6);
      --text-dim: rgba(11, 29, 58, 0.38);
      --input-bg: #fbfcfe;
      --ease: cubic-bezier(.22, .7, .2, 1);
    }

    body {
      font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background-color: #ffffff;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Hero Bowl Glow Atmosphere */
    .atmo-glow {
      position: fixed;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(circle, rgba(91, 124, 240, 0.18) 0%, rgba(47, 224, 208, 0.12) 40%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    .auth-section {
      width: 100%;
      max-width: 940px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .auth-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
      box-shadow: 0 20px 48px -12px rgba(11, 29, 58, 0.08), 0 1px 3px rgba(11, 29, 58, 0.04);
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    @media (min-width: 860px) {
      .auth-grid {
        grid-template-columns: 1fr 0.95fr;
        min-height: 530px;
      }
    }

    /* Left Form Panel */
    .form-card {
      display: flex;
      align-items: center;
      background-color: #ffffff;
      padding: 26px 28px;
      position: relative;
    }

    @media (min-width: 640px) {
      .form-card {
        padding: 28px 34px;
      }
    }

    .form-wrapper {
      margin: 0 auto;
      width: 100%;
      max-width: 360px;
    }

    .top-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-link svg {
      width: 22px;
      height: 22px;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .back-home:hover {
      color: var(--ink);
      background-color: rgba(91, 124, 240, 0.08);
    }

    /* Tab switcher for Sign In vs Create Account */
    .auth-mode-switch {
      display: inline-flex;
      background: rgba(11, 29, 58, 0.05);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 14px;
      gap: 3px;
      width: 100%;
      max-width: 220px;
      border: 1px solid rgba(11, 29, 58, 0.06);
    }

    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .mode-tab.active {
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(11, 29, 58, 0.08);
      font-weight: 600;
    }

    .form-heading {
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--ink);
    }

    .form-heading .highlight {
      color: var(--accent);
    }

    .form-subheading {
      margin-top: 4px;
      font-size: 13.5px;
      line-height: 1.35;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Social Buttons */
    .social-row {
      margin-top: 16px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .social-btn {
      display: flex;
      height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .social-btn:hover {
      background-color: rgba(91, 124, 240, 0.04);
      border-color: rgba(91, 124, 240, 0.4);
    }

    .social-btn .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Divider */
    .or-divider {
      margin: 14px 0;
      display: flex;
      align-items: center;
      text-align: center;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-dim);
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .or-divider span {
      padding: 0 12px;
    }

    /* Form & FieldBox */
    .form-inputs {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .two-cols {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .field-box {
      display: flex;
      height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      padding: 0 14px;
      font-size: 13.5px;
      line-height: 1;
      cursor: text;
      transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
      position: relative;
    }

    .field-box:focus-within {
      border-color: var(--border-focus);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(91, 124, 240, 0.12);
    }

    .field-box input {
      min-width: 0;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      color: var(--ink);
    }

    .field-box input::placeholder {
      color: var(--text-dim);
    }

    .pwd-toggle {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .pwd-toggle:hover {
      color: var(--ink);
    }

    /* Checkboxes */
    .checkbox-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 2px;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .checkbox-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .custom-check {
      position: relative;
      margin-top: 2px;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .custom-check input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .check-box {
      width: 100%;
      height: 100%;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .custom-check input:checked + .check-box {
      background: var(--ink);
      border-color: var(--ink);
    }

    .check-box svg {
      width: 9px;
      height: 9px;
      stroke: var(--dot);
      stroke-width: 2.2;
      fill: none;
      display: none;
    }

    .custom-check input:checked + .check-box svg {
      display: block;
    }

    .terms-link {
      font-weight: 500;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .terms-link:hover {
      color: var(--ink);
    }

    /* Hero Theme Signature Navy Pill Button with Cyan Dot */
    .submit-button {
      margin-top: 14px;
      position: relative;
      display: flex;
      height: 42px;
      width: 100%;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: none;
      background-color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      overflow: hidden;
      padding-right: 42px;
    }

    .submit-button .btn-dot {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--dot);
      box-shadow: 0 0 10px rgba(47, 224, 208, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--ease);
    }

    .submit-button .btn-dot svg {
      width: 10px;
      height: 10px;
      stroke: var(--ink);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transform: translateX(-3px);
      transition: all 0.2s ease;
    }

    .submit-button:hover {
      background-color: #162a4d;
    }

    .submit-button:hover .btn-dot {
      width: 26px;
      height: 26px;
      right: 8px;
      box-shadow: none;
    }

    .submit-button:hover .btn-dot svg {
      opacity: 1;
      transform: translateX(0);
    }

    .demo-button {
      margin-top: 8px;
      display: flex;
      height: 36px;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px dashed rgba(47, 224, 208, 0.7);
      background: rgba(47, 224, 208, 0.06);
      font-size: 13px;
      font-weight: 500;
      color: #0d8276;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .demo-button:hover {
      background: rgba(47, 224, 208, 0.14);
      border-color: var(--dot);
      color: var(--ink);
    }

    .error-banner {
      padding: 8px 12px;
      border-radius: 6px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 0.82rem;
      margin-bottom: 12px;
      display: none;
    }

    /* Right Card: Dark Midnight Split Theme (--panel: #0e1f3d) */
    .shader-card {
      position: relative;
      display: flex;
      min-height: 480px;
      overflow: hidden;
      background-color: var(--panel);
      padding: 30px 28px;
      color: #ffffff;
    }

    #shader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .grain-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.22;
      pointer-events: none;
      z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .shader-foreground {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100%;
      width: 100%;
      flex-direction: column;
      justify-content: space-between;
    }

    .shader-pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.76rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      width: fit-content;
      margin-bottom: 16px;
    }

    .shader-pill-badge span.dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dot);
      box-shadow: 0 0 8px var(--dot);
    }

    .shader-hero-text {
      max-width: 380px;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1.05;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    }

    .shader-hero-text .cyan-txt {
      color: var(--dot);
    }

    .shader-hero-text .blue-txt {
      color: #8fe6f4;
    }

    @media (min-width: 1024px) {
      .shader-hero-text {
        font-size: 38px;
      }
    }

    .shader-bottom-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 40px;
    }

    .windows-download-pill {
      display: inline-flex;
      height: 38px;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      transition: all 0.15s ease;
      width: fit-content;
    }

    .windows-download-pill:hover {
      border-color: var(--dot);
      color: #ffffff;
      background-color: rgba(47, 224, 208, 0.12);
    }

    .feature-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .feature-highlights span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- Background Atmosphere Bowl Glow Matching Hero Page -->
  <div class="atmo-glow"></div>

  <section class="auth-section">
    <div class="auth-grid">

      <!-- LEFT COLUMN -->
      <div class="form-card">
        <div class="form-wrapper">

          <div class="top-nav-bar">
            <a href="/" class="brand-link" title="Geosense Smart Agriculture">
              <svg viewBox="0 0 48 48" fill="none" width="28" height="28" style="flex-shrink: 0; border-radius: 7px;">
        <defs>

          </linearGradient>

            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="60%" stop-color="#2fe0d0"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </linearGradient>
        </defs>

        <path d="M12 24 A12 12 0 0 1 36 24" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.5 3.5"/>
        <path d="M34 16 C29 9 17 10 12 17 C6 25 8 36 18 40 C27 43 37 38 37 28 L23 28" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 38 C23 38 29 33 29 25 C29 19 25 15 22 13.5 C22 18.5 19.5 22 17.5 25 C15.5 28 23 38 23 38 Z" fill="url(#brand-sprout)"/>
        <circle cx="23" cy="28" r="2.4" fill="#2fe0d0"/>
        <circle cx="23" cy="28" r="4.2" stroke="rgba(47,224,208,0.5)" stroke-width="0.8"/>
      </svg>
              <span>Geosense</span>
            </a>
            <a href="/" class="back-home">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              <span>Back</span>
            </a>
          </div>

          <!-- Mode Switcher -->
          <div class="auth-mode-switch">
            <button type="button" class="mode-tab active" id="tab-login">Log In</button>
            <button type="button" class="mode-tab" id="tab-register">Sign Up</button>
          </div>

          <div>
            <h1 class="form-heading" id="main-heading">Log in to <span class="highlight">Geosense</span></h1>
            <p class="form-subheading" id="main-subheading">Access your AI agronomist and live farming telemetry</p>
          </div>

          <div class="social-row">
            <button type="button" class="social-btn" id="social-google">
              <span class="icon-box">
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09Z" fill="#4285F4"/>

            <button type="button" class="social-btn" id="social-apple">
              <span class="icon-box">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M17.05 12.54c-.03-3.02 2.47-4.47 2.58-4.54-1.41-2.06-3.6-2.34-4.38-2.37-1.86-.19-3.64 1.1-4.58 1.1-.95 0-2.42-1.07-3.98-1.04-2.05.03-3.94 1.19-4.99 3.02-2.13 3.69-.54 9.16 1.53 12.15 1.01 1.46 2.22 3.1 3.81 3.04 1.53-.06 2.11-.99 3.96-.99s2.37.99 3.99.96c1.65-.03 2.69-1.49 3.69-2.96 1.16-1.69 1.64-3.33 1.66-3.41-.04-.02-3.2-1.23-3.24-4.87ZM14.03 3.66c.84-1.02 1.41-2.43 1.25-3.84-1.21.05-2.68.81-3.55 1.83-.78.9-1.46 2.34-1.28 3.72 1.35.1 2.73-.69 3.58-1.71Z"/>

          </div>

          <div class="or-divider">
            <span>or with email</span>

          <div id="error-message" class="error-banner"></div>

          <form id="auth-form" class="form-inputs">
            <!-- Name fields (shown in register mode) -->
            <div class="two-cols" id="row-names" style="display: none;">
              <label class="field-box" id="box-first-name">
                <input type="text" id="field-first-name" placeholder="First Name" aria-label="First Name" />

                <input type="text" id="field-last-name" placeholder="Last Name" aria-label="Last Name" />
              </label>
            </div>

            <label class="field-box" id="box-email">
              <input type="email" id="field-email" value="harshitlog@gmail.com" required placeholder="Email address" aria-label="Email" />

            <label class="field-box" id="box-password">
              <input type="password" id="field-password" value="demo123456" required placeholder="Password" aria-label="Password" />

                <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </label>

            <div class="checkbox-section">
              <label class="checkbox-item" id="opt-remember">
                <span class="custom-check">
                  <input type="checkbox" id="chk-remember" checked />
                  <span class="check-box">
                    <svg viewBox="0 0 12 12"><path d="M2.5 6.2 4.8 8.5 9.5 3.5"/></svg>
                  </span>
                </span>
                <span>Keep me signed in</span>
              </label>

              <label class="checkbox-item" id="opt-terms" style="display: none;">
                <span class="custom-check">
                  <input type="checkbox" id="chk-terms" checked />
                  <span class="check-box">
                    <svg viewBox="0 0 12 12"><path d="M2.5 6.2 4.8 8.5 9.5 3.5"/></svg>
                  </span>
                </span>
                <span>
                  Agree to <a href="#" class="terms-link">Terms</a> & <a href="#" class="terms-link">Privacy</a>
                </span>
              </label>
            </div>

            <button type="submit" id="btn-submit" class="submit-button">
              <span>Sign In</span>
              <span class="btn-dot">
                <svg viewBox="0 0 12 12"><path d="M3 6h6m-2.5-2.5 2.5 2.5-2.5 2.5"/></svg>
              </span>
            </button>

            <button type="button" id="btn-demo-access" class="demo-button">
              <span>⚡ One-Click Instant Demo Access</span>
            </button>
          </form>

        </div>
      </div>

      <!-- RIGHT COLUMN: SHADER PANEL WITH HALDEN / GEOSENSE BOWL GLOW PALETTE -->
      <div class="shader-card">
        <canvas id="shader-canvas"></canvas>
        <div class="grain-overlay"></div>

        <div class="shader-foreground">
          <div>
            <div class="shader-pill-badge">
              <span class="dot"></span>
              <span>Autonomous Agricultural Intelligence</span>
            </div>
            <h2 class="shader-hero-text">
              Meet <span class="cyan-txt">Geo</span>,<br>
              your AI agronomist
            </h2>
          </div>

          <div class="shader-bottom-area">
            <a href="/" class="windows-download-pill">
              <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
                <path d="M3 4.7 10.7 3.6v7.7H3V4.7Zm8.8-1.25L21 2.1v9.2h-9.2V3.45ZM3 12.7h7.7v7.7L3 19.3v-6.6Zm8.8 0H21v9.2l-9.2-1.3v-7.9Z"/>
              </svg>
              <span>Download Windows App</span>
            </a>

            <div class="feature-highlights">
              <span>✓ Soil NPK Analysis</span>
              <span>✓ FAO-56 Irrigation</span>
              <span>✓ APMC Mandi Telemetry</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api-client.js"></script>
  <script>
    // 1. Redirect if already authenticated
    if (window.GeosenseApi && window.GeosenseApi.getToken()) {
      window.location.replace('/dashboard');
    }

    // 2. Tab switcher (Log In vs Sign Up)
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const rowNames = document.getElementById('row-names');
    const optRemember = document.getElementById('opt-remember');
    const optTerms = document.getElementById('opt-terms');
    const mainHeading = document.getElementById('main-heading');
    const mainSubheading = document.getElementById('main-subheading');
    const btnSubmit = document.getElementById('btn-submit');
    const labelGoogle = document.getElementById('label-google');
    const labelApple = document.getElementById('label-apple');
    let isRegisterMode = false;

    function setMode(register) {
      isRegisterMode = register;
      if (register) {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        rowNames.style.display = 'grid';
        optRemember.style.display = 'none';
        optTerms.style.display = 'flex';
        mainHeading.innerHTML = 'Join <span class="highlight">Geosense</span>';
        mainSubheading.textContent = 'Start with autonomous AI-driven agronomy';
        btnSubmit.querySelector('span:first-child').textContent = 'Create Account';
        labelGoogle.textContent = 'Google';
        labelApple.textContent = 'Apple';
      } else {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        rowNames.style.display = 'none';
        optRemember.style.display = 'flex';
        optTerms.style.display = 'none';
        mainHeading.innerHTML = 'Log in to <span class="highlight">Geosense</span>';
        mainSubheading.textContent = 'Access your AI agronomist and live farming telemetry';
        btnSubmit.querySelector('span:first-child').textContent = 'Sign In';
        labelGoogle.textContent = 'Google';
        labelApple.textContent = 'Apple';
      }
    }

    tabLogin.addEventListener('click', () => setMode(false));
    tabRegister.addEventListener('click', () => setMode(true));

    if (window.location.search.includes('register') || window.location.pathname.includes('register')) {
      setMode(true);
    }

    // 3. Password visibility toggle
    const pwdInput = document.getElementById('field-password');
    const pwdToggleBtn = document.getElementById('btn-toggle-pwd');
    if (pwdToggleBtn && pwdInput) {
      pwdToggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdToggleBtn.innerHTML = isPassword
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      });
    }

    // 4. Form submission & Supabase / FastAPI Auth integration
    const form = document.getElementById('auth-form');
    const submitBtn = document.getElementById('btn-submit');
    const errorBox = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      const btnText = submitBtn.querySelector('span:first-child');
      btnText.textContent = 'Authenticating...';

      const email = document.getElementById('field-email').value.trim();
      const password = document.getElementById('field-password').value;
      const firstName = document.getElementById('field-first-name') ? document.getElementById('field-first-name').value.trim() : '';
      const lastName = document.getElementById('field-last-name') ? document.getElementById('field-last-name').value.trim() : '';
      const fullName = `${firstName} ${lastName}`.trim();

      try {
        if (isRegisterMode) {
          await window.GeosenseApi.registerUser({
            full_name: fullName || 'Farmer Member',
            email,
            password,
            region: 'Punjab'
          });
          // Registration may require email confirmation, so establish a session
          // only after the server confirms a successful sign in.
          await window.GeosenseApi.loginUser(email, password);
        } else {
          await window.GeosenseApi.loginUser(email, password);
        }
        window.location.replace('/dashboard');
      } catch (err) {
        errorBox.style.display = 'block';
        errorBox.textContent = err.message || 'Authentication failed. Please check your details and try again.';
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = isRegisterMode ? 'Create Account' : 'Sign In';
      }
    });

    // 5. One-Click Instant Demo Access
    async function loginDemo() {
      const demoButton = document.getElementById('btn-demo-access');
      demoButton.disabled = true;
      try {
        await window.GeosenseApi.loginDemo();
        window.location.replace('/dashboard');
      } catch (err) {
        errorBox.style.display = 'block';
        errorBox.textContent = err.message || 'Demo access is unavailable. Please try again.';
        demoButton.disabled = false;
      }
    }

    document.getElementById('btn-demo-access').addEventListener('click', loginDemo);
    window.GeosenseApi.getAuthConfig().then((config) => {
      if (!config.demo_enabled) document.getElementById('btn-demo-access').hidden = true;
    }).catch(() => {
      document.getElementById('btn-demo-access').hidden = true;
    });
    const googleBtn = document.getElementById('social-google');
    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        errorBox.style.display = 'none';
        const label = document.getElementById('label-google');
        const origText = label ? label.textContent : 'Google';
        if (label) label.textContent = 'Redirecting...';
        googleBtn.disabled = true;

        try {
          await window.GeosenseApi.signInWithGoogle({
            redirectTo: `${window.location.origin}/auth/callback`
          });
        } catch (err) {
          googleBtn.disabled = false;
          if (label) label.textContent = origText;
          errorBox.style.display = 'block';
          errorBox.textContent = `Google Sign-In: ${err.message || 'Could not initiate Google authentication.'}`;
        }
      });
    }

    const appleBtn = document.getElementById('social-apple');
    if (appleBtn) {
      appleBtn.addEventListener('click', () => {
        errorBox.style.display = 'block';
        errorBox.textContent = 'Apple Sign-In is coming soon. Please use Google or Email to sign in.';
      });
    }

    // 6. Canvas Shader matching Hero Halden Atmosphere Palette:
    // Midnight navy base (#0e1f3d) + Glowing Periwinkle (#5b7cf0) + Cyan Turquoise (#2fe0d0)
    const canvas = document.getElementById('shader-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0, frame = 0;

    function resizeCanvas() {
      width = canvas.width = canvas.offsetWidth;
      height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderShader() {
      frame += 0.012;
      // Midnight navy base
      ctx.fillStyle = '#0e1f3d';
      ctx.fillRect(0, 0, width, height);

      // Orbs matching Geosense / Halden palette:
      // #5b7cf0 (periwinkle blue), #2fe0d0 (cyan turquoise), #8fe6f4 (sky cyan), #3f7cff (royal)
      const orbs = [
        {
          x: width * 0.15 + Math.sin(frame * 0.75) * (width * 0.12),
          y: height * 0.2 + Math.cos(frame * 0.85) * (height * 0.1),
          r: Math.max(width, height) * 0.6,
          color0: 'rgba(91, 124, 240, 0.75)',     // #5b7cf0
          color1: 'rgba(47, 224, 208, 0.35)',     // #2fe0d0
          color2: 'rgba(14, 31, 61, 0)'
        },
        {
          x: width * 0.85 + Math.cos(frame * 0.65) * (width * 0.1),
          y: height * 0.25 + Math.sin(frame * 0.8) * (height * 0.12),
          r: Math.max(width, height) * 0.65,
          color0: 'rgba(47, 224, 208, 0.8)',      // #2fe0d0
          color1: 'rgba(91, 124, 240, 0.3)',      // #5b7cf0
          color2: 'rgba(14, 31, 61, 0)'
        },
        {
          x: width * 0.25 + Math.sin(frame * 0.85) * (width * 0.1),
          y: height * 0.8 + Math.cos(frame * 0.7) * (height * 0.12),
          r: Math.max(width, height) * 0.7,
          color0: 'rgba(143, 230, 244, 0.6)',     // #8fe6f4
          color1: 'rgba(63, 124, 255, 0.35)',     // #3f7cff
          color2: 'rgba(14, 31, 61, 0)'
        },
        {
          x: width * 0.8 + Math.cos(frame * 0.8) * (width * 0.12),
          y: height * 0.75 + Math.sin(frame * 0.65) * (height * 0.1),
          r: Math.max(width, height) * 0.55,
          color0: 'rgba(91, 124, 240, 0.65)',
          color1: 'rgba(47, 224, 208, 0.25)',
          color2: 'rgba(14, 31, 61, 0)'
        }
      ];

      for (let i = 0; i < orbs.length; i++) {
        const o = orbs[i];
        const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
        grad.addColorStop(0, o.color0);
        grad.addColorStop(0.5, o.color1);
        grad.addColorStop(1, o.color2);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(renderShader);
    }

    renderShader();
  </script>
</body>
