<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Geosense Smart Agriculture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1d3a;
      --accent: #5b7cf0;
      --dot: #2fe0d0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid rgba(11, 29, 58, 0.08);
      box-shadow: 0 20px 45px -10px rgba(11, 29, 58, 0.1);
      padding: 36px 32px;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: #64748b; margin-bottom: 22px; line-height: 1.5; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 18px;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background: #172d54; }
    .auth-footer { margin-top: 22px; text-align: center; font-size: 0.88rem; color: #64748b; }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .success-msg { padding: 12px; background: #ecfdf5; color: #065f46; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <a href="/" class="brand-link">
      <svg viewBox="0 0 22 22" width="22" height="22">
        <circle cx="11" cy="11" r="11" fill="#5b7cf0"/>
        <path d="M7 14c0-3.5 3-6.5 6.5-6.5 0 3.5-3 6.5-6.5 6.5z" fill="#fff"/>
        <path d="M10.5 14c0-2.2 2-4 4-4" stroke="#2fe0d0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      Geosense
    </a>
    <h1>Password Recovery</h1>
    <p>Enter your registered farmer email and we'll send you instructions to reset your password.</p>
    <div id="success" class="success-msg">Reset link has been dispatched to your email address!</div>
    <form id="forgot-form">
      <div class="field">
        <label for="email">Account Email</label>
        <input type="email" id="email" required placeholder="farmer@example.com" />
      </div>
      <button type="submit" class="btn-submit">Send Password Reset Link</button>
    </form>
    <div class="auth-footer">
      Remembered password? <a href="/login">Back to Sign In</a>
    </div>
  </div>
  <script>
    document.getElementById('forgot-form').onsubmit = (e) => {
      e.preventDefault();
      document.getElementById('success').style.display = 'block';
      document.getElementById('forgot-form').style.display = 'none';
    };
  </script>
</body>
</html>
